name: tton

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js inlinea NEXT_PUBLIC_* al build time. Si esto no se pasa
        # en build, el fallback "http://localhost:3000" queda hardcoded
        # en el bundle del server (links de mail rompen en prod).
        NEXT_PUBLIC_BASE_URL: https://t-tonisland.com
    image: ttonisland:latest
    container_name: tton-app
    restart: unless-stopped
    # Resource caps — evitar OOM del host por leak o spike.
    # 75MB es el baseline observado; 512M deja ~7x headroom.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    environment:
      # Limit V8 heap a 384MB → JS muere con error visible antes que
      # el container OOM-kill silencioso. 128MB de slack para no-heap.
      NODE_OPTIONS: --max-old-space-size=384
      # DB — file persistente en el volume
      DATABASE_URL: file:/app/data/tton.db
      # NextAuth
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://t-tonisland.com
      AUTH_TRUST_HOST: "true"
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      # Microsoft Graph (email notifications)
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL}
      # Base URL (server-side y client-side)
      NEXT_PUBLIC_BASE_URL: https://t-tonisland.com
    volumes:
      - tton-data:/app/data
    networks:
      - tton-net
    expose:
      - "3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tton-tunnel
    restart: unless-stopped
    # Cloudflared idle ~29MB; 96MB deja 3x headroom y evita que un leak
    # en cloudflared tumbe el host.
    mem_limit: 96m
    cpus: 0.5
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - tton-net

networks:
  tton-net:
    driver: bridge

volumes:
  tton-data:
    driver: local
